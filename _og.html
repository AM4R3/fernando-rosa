<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#120E16;font-family:Archivo,sans-serif;color:#F4EFE7}
.card{position:relative;width:1200px;height:630px;background:linear-gradient(150deg,#120E16 0%,#2A1E38 62%,#120E16 100%);overflow:hidden}
.foto{position:absolute;top:0;right:0;bottom:0;width:62%;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 30%);mask-image:linear-gradient(90deg,transparent 0%,#000 30%)}
.foto img{width:100%;height:100%;object-fit:cover;object-position:34% 30%;opacity:.92;filter:saturate(.78) contrast(1.04)}
.foto::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,14,22,.7) 0%,rgba(18,14,22,.3) 34%,rgba(18,14,22,.06) 60%,rgba(18,14,22,.3) 100%)}
.luz{position:absolute;top:-40%;left:-15%;width:70%;height:180%;background:radial-gradient(closest-side,rgba(242,160,61,.3),transparent 72%);filter:blur(4px)}
.corda{position:absolute;left:0;right:0;background:linear-gradient(90deg,transparent,rgba(244,239,231,.3) 8%,rgba(242,160,61,.85) 50%,rgba(244,239,231,.3) 92%,transparent)}
.c1{top:24%;height:3px;opacity:.8}.c2{top:40%;height:2.2px;opacity:.7}.c3{top:58%;height:1.6px;opacity:.6}.c4{top:74%;height:1.2px;opacity:.5}
.txt{position:absolute;left:74px;bottom:78px;z-index:5;max-width:600px}
.tag{font-size:15px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:#A79BB5;margin-bottom:22px;display:flex;align-items:center;gap:14px}
.tag i{display:block;width:38px;height:2px;background:#F2A03D}
h1{font-family:Unbounded,sans-serif;font-weight:800;font-size:76px;line-height:.92;letter-spacing:-.03em;text-shadow:0 8px 42px rgba(18,14,22,.8)}
p{margin-top:22px;font-size:25px;max-width:19ch;text-shadow:0 2px 18px rgba(18,14,22,.9)}
p b{font-weight:700}
</style></head><body>
<div class="card">
  <div class="foto"><img src="img/hero-rs.jpg"></div>
  <div class="luz"></div>
  <div class="corda c1"></div><div class="corda c2"></div><div class="corda c3"></div><div class="corda c4"></div>
  <div class="txt">
    <div class="tag"><i></i>Baixo · palco · estrada</div>
    <h1>Groove de<br>corpo e alma.</h1>
    <p><b>Fernando Rosa.</b> Baixista.</p>
  </div>
</div></body></html>
